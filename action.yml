# AegisGate Scanner — GitHub Action
#
# Static analysis for AI artifacts: detect prompt injection, PII, secrets,
# and compliance violations in RAG docs, training data, model configs,
# and agent skills.
#
# ---
#
# Example workflow:
#
#   steps:
#     - uses: actions/checkout@v7
#     - uses: aegisgatesecurity/aegisgate-scanner@v0.3.0
#       with:
#         path: '.'
#         format: 'sarif'
#         severity: 'medium'
#     - uses: github/codeql-action/upload-sarif@v4
#       with:
#         sarif_file: aegisgate-report.sarif
#
# ---
#
# The `fail-on-findings` input is handled via the CLI exit code:
#   - Exit code 1 = findings detected → workflow fails
#   - Exit code 0 = clean → workflow continues
# GitHub Actions automatically fails on non-zero exit codes. To ignore
# findings and continue, set `continue-on-error: true` on the step:
#
#   - uses: aegisgatesecurity/aegisgate-scanner@v0.3.0
#     with:
#       fail-on-findings: 'false'
#     continue-on-error: true
#
# ---
#
# Advanced options (no-ml, diff, baseline, disable-rule, concurrency,
# no-extract-archives, quiet) are supported via the entrypoint script.
# See the README for full CLI documentation.

name: 'AegisGate Scanner'
description: 'Static analysis for AI artifacts — detect prompt injection, PII, secrets, and compliance violations in RAG docs, training data, model configs, and agent skills'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  format:
    description: 'Output format (sarif, json, text, html, pr-comment, github-actions, sbom)'
    required: false
    default: 'sarif'
  severity:
    description: 'Minimum severity (critical, high, medium, low)'
    required: false
    default: 'medium'
  no-ml:
    description: 'Disable ML detection (heuristic-only)'
    required: false
    default: 'false'
  diff:
    description: 'Base branch for diff scanning (e.g., main). Only scans changed files.'
    required: false
    default: ''
  baseline:
    description: 'Path to baseline suppression file'
    required: false
    default: ''
  disable-rule:
    description: 'Comma-separated list of rule IDs to disable (e.g., "xss_stored_basic,secret_aws_key")'
    required: false
    default: ''
  concurrency:
    description: 'Number of parallel workers (default: auto-detect)'
    required: false
    default: ''
  no-extract-archives:
    description: 'Disable automatic archive extraction'
    required: false
    default: 'false'
  quiet:
    description: 'Suppress output (exit code only)'
    required: false
    default: 'false'
  fail-on-findings:
    description: 'Fail the workflow if findings are detected (exit code 1). Set to "false" and use continue-on-error: true to ignore.'
    required: false
    default: 'true'

runs:
  using: 'docker'
  image: 'Dockerfile'
  entrypoint: '/entrypoint.sh'
  env:
    INPUT_PATH: ${{ inputs.path }}
    INPUT_FORMAT: ${{ inputs.format }}
    INPUT_SEVERITY: ${{ inputs.severity }}
    INPUT_NO_ML: ${{ inputs.no-ml }}
    INPUT_DIFF: ${{ inputs.diff }}
    INPUT_BASELINE: ${{ inputs.baseline }}
    INPUT_DISABLE_RULE: ${{ inputs.disable-rule }}
    INPUT_CONCURRENCY: ${{ inputs.concurrency }}
    INPUT_NO_EXTRACT_ARCHIVES: ${{ inputs.no-extract-archives }}
    INPUT_QUIET: ${{ inputs.quiet }}